services:
  nodo_1:
    image: cassandra:4.1
    container_name: nodo_1
    hostname: nodo_1
    networks:
      - cassandra_network
    ports:
      - "9042:9042"
    volumes:
      - ./data/nodo_1:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: Cluster_BBDDA
      CASSANDRA_SEEDS: nodo_1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 90s

  nodo_2:
    image: cassandra:4.1
    container_name: nodo_2
    hostname: nodo_2
    networks:
      - cassandra_network
    ports:
      - "9043:9042"
    volumes:
      - ./data/nodo_2:/var/lib/cassandra
    depends_on:
      nodo_1:
        condition: service_healthy
    command: bash -c "sleep 30 && /usr/local/bin/docker-entrypoint.sh cassandra -f"
    environment:
      CASSANDRA_CLUSTER_NAME: Cluster_BBDDA
      CASSANDRA_SEEDS: nodo_1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

  nodo_3:
    image: cassandra:4.1
    container_name: nodo_3
    hostname: nodo_3
    networks:
      - cassandra_network
    ports:
      - "9044:9042"
    volumes:
      - ./data/nodo_3:/var/lib/cassandra
    depends_on:
      nodo_2:
        condition: service_healthy
    command: bash -c "sleep 90 && /usr/local/bin/docker-entrypoint.sh cassandra -f"
    environment:
      CASSANDRA_CLUSTER_NAME: Cluster_BBDDA
      CASSANDRA_SEEDS: nodo_1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

networks:
  cassandra_network:
    driver: bridge